name: Release Obsidian plugin

on:
  push:
    tags:
      - '*'

env:
  PLUGIN_NAME: igdb-game-search

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@v3
        name: Install pnpm
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: store-path
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        id: build
        run: pnpm build

      - name: Extract changelog section for this release
        id: changelog
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          awk -v ver="[$VERSION]" '
            $0 ~ "^## \\[" {
              if (in_section) exit;
              if (index($0, ver) > 0) { in_section = 1; print; next }
            }
            in_section { print }
          ' CHANGELOG.md > "${{ github.workspace }}/release-notes.md"
          if [ ! -s "${{ github.workspace }}/release-notes.md" ]; then
            echo "No changelog section found for $VERSION" > "${{ github.workspace }}/release-notes.md"
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            main.js
            styles.css
            manifest.json
          body_path: ${{ github.workspace }}/release-notes.md
